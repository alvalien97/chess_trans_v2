spring.application.name=chess-backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transcendence}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chess}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chess}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
